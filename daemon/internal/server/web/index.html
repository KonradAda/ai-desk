<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-desk simulator</title>
<style>
  :root {
    --page: #e8e6df; --bezel: #1c1c1b; --screen: #121211; --card: #1f1f1d; --card-border: #2e2e2b;
    --text: #f1efe8; --muted: #a3a199; --accent: #378add;
    --working-bg: #0c447c; --working-fg: #b5d4f4;
    --waiting-bg: #633806; --waiting-fg: #fac775; --waiting-border: #ef9f27;
    --done-bg: #27500a; --done-fg: #c0dd97;
    --error-bg: #791f1f; --error-fg: #f7c1c1;
    --interrupted-bg: #4a1b0c; --interrupted-fg: #f0997b;
    --idle-bg: #2c2c2a; --idle-fg: #b4b2a9;
  }
  @media (prefers-color-scheme: dark) { :root { --page: #0b0b0b; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--page); display: flex; align-items: center; justify-content: center;
         font-family: system-ui, "Segoe UI", sans-serif; padding: 16px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  .device { background: var(--bezel); border-radius: 22px; padding: 18px; width: min(100%, 836px); }
  .screen { position: relative; width: 100%; aspect-ratio: 800 / 480; background: var(--screen); border-radius: 6px; overflow: hidden; }
  /* Everything inside is laid out at the device's native 800x480 and scaled to fit. */
  .native { position: absolute; top: 0; left: 0; width: 800px; height: 480px; transform-origin: 0 0;
            padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; color: var(--text); }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); padding: 0 4px; height: 24px; }
  .top-right { display: flex; align-items: center; gap: 12px; }
  .conn { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e24b4a; margin-right: 6px; }
  .conn.on { background: #639922; }
  .icon-btn { width: 28px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--muted); }
  .icon-btn:hover { background: var(--card); color: var(--text); }

  /* 60 columns so rows of 1 to 6 cards all divide evenly; render() sets rows and spans. */
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(60, 1fr); grid-template-rows: 1fr; gap: 10px; touch-action: pan-y; }
  .grid.rows-2 { grid-template-rows: 1fr 1fr; }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px;
          display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; overflow: hidden; }
  .card.waiting { border: 2px solid var(--waiting-border); }
  /* Agents of one project share a box (later: the arena where they fight one enemy together),
     split by a thin line. Cards inside drop their own frame. */
  .group { display: flex; min-width: 0; min-height: 0; background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; }
  /* Each group has its own faded color; the project name sits on a stronger label of it.
     A group cut across rows keeps the color on both parts. */
  .group.tinted, .card.tinted { background: color-mix(in srgb, var(--group) 11%, var(--card)); border-color: color-mix(in srgb, var(--group) 35%, var(--card-border)); }
  .group.tinted .card + .card { border-left-color: color-mix(in srgb, var(--group) 30%, var(--card-border)); }
  .tinted .name .proj { background: color-mix(in srgb, var(--group) 55%, var(--card)); padding: 0 8px; border-radius: 6px; }
  /* The mascots live on a stage over the cards (see tickStage): each stands
     at its card's home spot or walks to its group's campfire. While one is
     away its card hides the badge and moves × to the outer corner. */
  .group { position: relative; }
  .stage { position: absolute; inset: 0; pointer-events: none; }
  .stage[hidden] { display: none; }
  .actor, .fire { position: absolute; top: 0; left: 0; }
  .actor svg.mascot, .fire svg { display: block; }
  .fire > svg { transform: scale(.15); opacity: 0; transform-origin: 50% 90%; transition: transform 1.2s ease-in, opacity 1.2s ease-in; }
  .fire.lit > svg { transform: scale(1); opacity: 1; transition: transform .8s ease-out, opacity .5s ease-out; }
  .fire::before { content: ""; position: absolute; inset: -40% -160%; z-index: -1; opacity: 0; transition: opacity 1.2s;
                  background: radial-gradient(closest-side, rgba(242, 160, 61, .13), transparent); }
  .fire.lit::before { opacity: 1; }
  .home-spot { visibility: hidden; }
  .card.camp .badge { display: none; }
  .card.camp-l .head { flex-direction: row-reverse; }
  .group .card { flex: 1 1 0; border: 0; border-radius: 0; background: none; }
  .group .card + .card { border-left: 1px solid var(--card-border); }
  .group .card.waiting { border: 0; box-shadow: inset 0 0 0 2px var(--waiting-border); }
  .group .card.waiting + .card, .group .card + .card.waiting { border-left-color: transparent; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; height: 48px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 6px; white-space: nowrap; }
  .working .badge { background: var(--working-bg); color: var(--working-fg); }
  .waiting .badge { background: var(--waiting-bg); color: var(--waiting-fg); }
  .done .badge { background: var(--done-bg); color: var(--done-fg); }
  .error .badge { background: var(--error-bg); color: var(--error-fg); }
  .interrupted .badge { background: var(--interrupted-bg); color: var(--interrupted-fg); }
  .idle .badge { background: var(--idle-bg); color: var(--idle-fg); }
  /* Single-line texts cut long values with "…"; line-height leaves room for
     descenders (g, y, ą) so overflow: hidden doesn't clip them. */
  .name { font-size: 17px; font-weight: 600; margin: 4px 0 0; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
  .line { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
  .action { color: var(--text); }
  /* Card heading: "project / session title"; the title is lighter and is what gets cut with "…". */
  .name .sep, .name .sess { font-weight: 400; color: var(--muted); }
  .name .sep { margin: 0 .3em; }
  .agent { font-size: 12px; }
  .size-l .agent { font-size: 17px; }
  .size-m .agent { font-size: 13px; }
  /* Footer row: progress bar with the elapsed time next to it. */
  .foot { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .foot .line { flex-shrink: 0; }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--card-border); overflow: hidden; }
  .fill { height: 100%; border-radius: 3px; background: var(--working-fg); transition: width 1.5s linear; }
  .waiting .fill { background: var(--waiting-border); }
  .done .fill { background: var(--done-fg); }
  .size-l .bar { height: 10px; border-radius: 5px; }
  .size-m .bar { height: 8px; border-radius: 4px; }
  .empty { grid-column: 1 / -1; grid-row: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 12px; color: var(--muted); font-size: 15px; }
  /* Two rows of cards (3-6 agents) are short, so they get tighter spacing. */
  .rows-2 .card { padding: 9px 12px; gap: 3px; }
  .rows-2 .head { height: 64px; }
  .rows-2 svg.mascot { width: 84px; height: 64px; }
  /* Bigger cards (1 or 2 agents on a page) get bigger mascots and text. */
  .size-l .card { padding: 22px 28px; gap: 8px; justify-content: center; }
  .size-l .head { height: auto; }
  .size-l svg.mascot { width: 182px; height: 140px; }
  .size-l .badge { font-size: 18px; padding: 6px 16px; }
  .size-l .name { font-size: 36px; }
  .size-l .line { font-size: 20px; }
  .size-m .card { padding: 18px; gap: 10px; justify-content: center; }
  .size-m .head { height: auto; }
  .size-m svg.mascot { width: 156px; height: 120px; }
  .size-m .badge { font-size: 14px; padding: 4px 12px; }
  .size-m .name { font-size: 24px; }
  .size-m .line { font-size: 15px; }
  .card[draggable] { cursor: grab; }
  .card.dragging { opacity: .4; }
  /* Cards of sessions in the Claude app open that session when clicked. */
  .card[data-open] { cursor: pointer; }
  .card.opening { outline: 2px solid var(--accent); outline-offset: -2px; }
  .drop { outline: 2px dashed var(--muted); outline-offset: -2px; }

  .pager { display: flex; align-items: center; justify-content: center; gap: 14px; height: 28px; }
  .pager[hidden] { display: none; }
  .arrow { width: 44px; height: 28px; border-radius: 8px; color: var(--muted); font-size: 18px; }
  .arrow:hover { background: var(--card); color: var(--text); }
  .arrow:disabled { opacity: .25; cursor: default; background: none; }
  .dots { display: flex; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--card-border); }
  .dot.current { background: var(--text); }
  .dot.alert { background: var(--waiting-border); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .4 } }
  .dot.alert.current { box-shadow: 0 0 0 2px var(--text); }

  .panel { position: absolute; inset: 0; background: var(--screen); padding: 16px 24px; display: flex; flex-direction: column; gap: 14px; }
  .panel[hidden] { display: none; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; }
  .panel-head h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .setting { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--card-border); }
  .setting-label { font-size: 15px; }
  .setting-hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .seg { display: flex; background: var(--card); border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button { min-width: 40px; height: 32px; padding: 0 10px; border-radius: 6px; font-size: 14px; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #fff; }
  .toggle { width: 52px; height: 30px; border-radius: 15px; background: var(--card-border); position: relative; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--text); transition: left .15s; }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { left: 25px; }

  /* Manual mode: "+" opens a list of agents that aren't on screen; "×" on a card takes it off. */
  .add-btn { position: relative; font-size: 20px; line-height: 1; }
  .add-btn[hidden], .alert-dot[hidden] { display: none; }
  .alert-dot { position: absolute; top: 1px; right: 1px; width: 7px; height: 7px; border-radius: 50%; background: var(--waiting-border); }
  .head-right { display: flex; align-items: center; gap: 4px; }
  .remove { width: 22px; height: 22px; border-radius: 6px; color: var(--muted); font-size: 16px; line-height: 1; }
  .remove:hover { background: var(--card-border); color: var(--text); }
  .pick-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0; }
  .pick { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px; border-radius: 10px; background: var(--card); text-align: left; }
  .pick:hover { background: var(--card-border); }
  .pick svg.mascot { width: 36px; height: 28px; }
  .pick-text { flex: 1; min-width: 0; }
  .pick-empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
</style>
<link rel="stylesheet" href="mascot.css">
</head>
<body>
<div class="device"><div class="screen"><div class="native" id="native">
  <div class="top">
    <span id="summary">…</span>
    <span class="top-right">
      <span><span class="conn" id="conn"></span><span id="clock"></span></span>
      <button class="icon-btn add-btn" id="open-picker" data-i18n-label="addAgent" hidden>+<span class="alert-dot" id="hidden-alert" hidden></span></button>
      <button class="icon-btn" id="open-settings" data-i18n-label="settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="stage" id="stage"></div>
  <div class="pager" id="pager" hidden>
    <button class="arrow" id="prev" data-i18n-label="previousPage">‹</button>
    <div class="dots" id="dots"></div>
    <button class="arrow" id="next" data-i18n-label="nextPage">›</button>
  </div>

  <div class="panel" id="panel" hidden>
    <div class="panel-head"><h2 data-i18n="settings"></h2><button class="icon-btn" id="close-settings" data-i18n-label="close" style="font-size:20px">×</button></div>
    <div class="setting">
      <div><div class="setting-label" data-i18n="sessionMode"></div><div class="setting-hint" data-i18n="sessionModeHint"></div></div>
      <div class="seg" id="set-mode"></div>
    </div>
    <div class="setting">
      <div><div class="setting-label" data-i18n="cardsPerPage"></div><div class="setting-hint" data-i18n="cardsPerPageHint"></div></div>
      <div class="seg" id="set-cards"></div>
    </div>
    <div class="setting">
      <div><div class="setting-label" data-i18n="jumpToWaiting"></div><div class="setting-hint" data-i18n="jumpToWaitingHint"></div></div>
      <button class="toggle" id="set-jump" role="switch"></button>
    </div>
    <div class="setting">
      <div><div class="setting-label" data-i18n="hideDone"></div><div class="setting-hint" data-i18n="hideDoneHint"></div></div>
      <div class="seg" id="set-hide"></div>
    </div>
    <div class="setting">
      <div class="setting-label" data-i18n="language"></div>
      <div class="seg" id="set-lang"></div>
    </div>
  </div>

  <div class="panel" id="picker" hidden>
    <div class="panel-head"><h2 data-i18n="addAgent"></h2><button class="icon-btn" id="close-picker" data-i18n-label="close" style="font-size:20px">×</button></div>
    <div class="pick-list" id="pick-list"></div>
  </div>
</div></div></div>

<script src="mascot.js"></script>
<script src="life.js"></script>
<script>
// All display text lives here. To add a language, add another entry with the
// same keys (and its code to settings.Languages in the daemon).
const STRINGS = {
  en: {
    languageName: "English",
    status: { working: "Working", waiting: "Needs you", done: "Done", error: "Error", idle: "Idle", interrupted: "Interrupted" },
    action: {
      idle: "Waiting for a prompt", thinking: "Thinking…", edit: "Editing {arg}", read: "Reading {arg}",
      run: "Running: {arg}", search_code: "Searching the code", search_web: "Searching the web",
      delegate: "Delegating to a subagent", plan: "Planning steps", mcp: "Using an MCP tool", tool: "Using {arg}",
      permission: "Asks permission: {arg}", input: "Waiting for your reply", question: "Asks you a question", plan_approval: "Waiting for plan approval", attention: "Needs your attention", done: "Done", interrupted: "Stopped by you",
    },
    summary: "{working} working · {waiting} waiting · {done} done",
    newSession: "New session",
    agent: { "claude-code": "Claude Code" },
    client: { "claude-desktop": "desktop app", cli: "terminal" },
    effort: { low: "Low effort", medium: "Medium effort", high: "High effort", xhigh: "Extra high effort", max: "Max effort" },
    otherEffort: "{effort} effort",
    runsIn: "Runs in the {client}",
    justNow: "just now", minutes: "{m} min", hoursMinutes: "{h} h {m} min",
    finishedAgo: "Finished {ago} ago", finishedJustNow: "Finished just now",
    interruptedAgo: "Stopped {ago} ago", interruptedJustNow: "Stopped just now",
    step: "Step {n}/{total}",
    empty: "No active agents. Start a Claude Code session.",
    emptyManual: "No agents on the screen. Tap + to add one.",
    addAgent: "Add an agent", removeAgent: "Take off the screen", openInClaude: "Open in Claude",
    allOnScreen: "Every active agent is already on the screen.",
    sessionMode: "Agents on the screen", sessionModeHint: "Automatic shows every agent, manual only the ones you add",
    modes: { auto: "Automatic", manual: "Manual" },
    settings: "Settings", close: "Close", previousPage: "Previous page", nextPage: "Next page",
    cardsPerPage: "Agents per screen", cardsPerPageHint: "More agents go to the next pages",
    jumpToWaiting: "Jump to agent that needs you", jumpToWaitingHint: "Switches to its page automatically",
    hideDone: "Hide finished agents", hideDoneHint: "They come back when they start working again",
    never: "Never", afterMinutes: "{m} min",
    language: "Language",
  },
};

let lang = "en";
// t looks up a key ("action.edit") in the current language, falling back to English.
function t(key, vars = {}) {
  const find = dict => key.split(".").reduce((o, k) => (o && o[k] !== undefined ? o[k] : undefined), dict);
  const s = find(STRINGS[lang]) ?? find(STRINGS.en) ?? key;
  return s.replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? "");
}

function translateStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-label]").forEach(el => {
    el.setAttribute("aria-label", t(el.dataset.i18nLabel));
    el.title = t(el.dataset.i18nLabel);
  });
}

function minutesSince(from, now) { return Math.max(0, Math.floor((now - from) / 60000)); }

function duration(m) {
  if (m < 1) return t("justNow");
  if (m < 60) return t("minutes", { m });
  return t("hoursMinutes", { h: Math.floor(m / 60), m: m % 60 });
}

function actionText(a) {
  if (!a) return "";
  if (a.kind === "text" || a.kind === "notice") return a.arg || ""; // written by the agent, shown as is
  return t(`action.${a.kind}`, { arg: a.arg || "" });
}

function metaText(s, now) {
  let meta = "";
  if (s.status === "done") {
    const m = minutesSince(new Date(s.finished_at), now);
    meta = m < 1 ? t("finishedJustNow") : t("finishedAgo", { ago: duration(m) });
  } else if (s.status === "interrupted") {
    const m = minutesSince(new Date(s.finished_at), now);
    meta = m < 1 ? t("interruptedJustNow") : t("interruptedAgo", { ago: duration(m) });
  } else if (s.status !== "idle") {
    meta = duration(minutesSince(new Date(s.turn_start), now));
  }
  return meta;
}

// modelName shortens model ids for the card: claude-opus-5-5 -> Opus 5.5.
// Ids in another format are shown as they are.
function modelName(id) {
  const m = /^claude-([a-z]+)-(\d+)(?:-(\d{1,2}))?(?:-|\[|$)/.exec(id || "");
  if (!m) return id || "";
  return `${m[1][0].toUpperCase()}${m[1].slice(1)} ${m[2]}${m[3] ? "." + m[3] : ""}`;
}

// agentLine says which agent runs the session and with what: "Claude Code · Opus 5.5 · Medium effort".
function agentLine(s) {
  const parts = [t(`agent.${s.agent}`) === `agent.${s.agent}` ? s.agent : t(`agent.${s.agent}`)];
  if (s.model) parts.push(modelName(s.model));
  if (s.effort) {
    const e = t(`effort.${s.effort}`);
    parts.push(e === `effort.${s.effort}` ? t("otherEffort", { effort: s.effort }) : e);
  }
  return parts.filter(Boolean).join(" · ");
}

function stepText(s) {
  if (!s.steps || s.status === "done") return "";
  const n = Math.min(s.steps.done + 1, s.steps.total);
  const label = t("step", { n, total: s.steps.total });
  return s.steps.current ? `${label} · ${s.steps.current}` : label;
}

// progress turns the agent's plan into a bar that matches the step shown on the
// card: "Step 2/4" starts at 50%, "Step 3/4" at 75%. The first step starts low
// (10%) so a fresh plan doesn't look a quarter done. The last step starts short
// of the end (up to 15% before it), and 100% only comes when the agent stops.
// Within a step the bar eases toward the next step's mark the longer the step
// runs, but never reaches it before the step is completed.
function progress(s, now) {
  if (!s.steps) return null;
  if (s.status === "done") return 100;
  const { done, total } = s.steps;
  const step = Math.min(done + 1, total); // the step number shown on the card
  const lastMark = 100 - Math.min(15, 60 / total);
  const mark = n => (n >= total ? lastMark : n === 1 ? 10 : (n / total) * 100);
  const from = mark(step);
  const to = step >= total ? 99 : mark(step + 1);
  const secs = Math.max(0, (now - new Date(s.steps.since)) / 1000);
  return from + (to - from) * 0.85 * (1 - Math.exp(-secs / 120));
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

let latest = { sessions: [], now: new Date().toISOString(), settings: { cards_per_page: 6, jump_to_waiting: true, hide_done_after_min: 0, language: "en", session_mode: "auto" }, languages: ["en"] };
let offset = 0; // server clock minus local clock
let page = 0;
let lastStatus = {}; // session id -> status in the previous update, to spot new waits
let changed = {}; // session id -> { kind: "wake" | "sleep", at } when it last fell asleep or woke up
let dragId = null;

// groupOrder keeps the agents of one project next to each other: projects
// come in the order of their first card, agents within one by slot.
// Group colors are muted and keep clear of the status colors (blue, orange, green).
const GROUP_COLORS = ["#7F77DD", "#D4537E", "#5DCAA5", "#B4B2A9", "#ED93B1", "#AFA9EC"];

// groupColors gives every project with two or more agents its own color, in
// card order, so groups on one screen never share a color.
function groupColors(sessions) {
  const count = {};
  sessions.forEach(s => { count[s.project] = (count[s.project] || 0) + 1; });
  const colors = {};
  let next = 0;
  sessions.forEach(s => {
    if (count[s.project] > 1 && !(s.project in colors)) colors[s.project] = GROUP_COLORS[next++ % GROUP_COLORS.length];
  });
  return colors;
}

// splitRows picks how many cards go in the top row: a split that keeps every
// project's group whole, as even as possible (top row bigger on a tie), with
// at most 3 cards per row (2x3 is the most the screen shows). If none exists,
// the rows are split evenly, the group is cut and its color shows the two
// parts belong together.
function splitRows(sessions) {
  const n = sessions.length;
  const cuts = i => sessions[i - 1].project === sessions[i].project;
  let best = null;
  for (let top = 1; top < n; top++) {
    if (cuts(top) || top > 3 || n - top > 3) continue;
    if (best === null || Math.abs(top - n / 2) < Math.abs(best - n / 2) ||
        (Math.abs(top - n / 2) === Math.abs(best - n / 2) && top > best)) best = top;
  }
  return best ?? Math.ceil(n / 2);
}

function groupOrder(sessions) {
  const first = {};
  sessions.forEach(s => { if (!(s.project in first) || s.slot < first[s.project]) first[s.project] = s.slot; });
  return [...sessions].sort((a, b) => first[a.project] - first[b.project] || a.slot - b.slot);
}

// onScreen is the agents the screen shows: all of them, or in manual mode
// only the ones the user added.
function onScreen() {
  const all = latest.sessions || [];
  return latest.settings.session_mode === "manual" ? all.filter(s => s.pinned) : all;
}

function pages() {
  const size = latest.settings.cards_per_page || 6;
  const out = [];
  const ordered = groupOrder(onScreen());
  for (let i = 0; i < ordered.length; i += size) out.push(ordered.slice(i, i + size));
  return out;
}

function render() {
  if (dragId) return;
  const now = Date.now() + offset;
  const grid = document.getElementById("grid");
  const all = onScreen();
  const counts = { working: 0, waiting: 0, done: 0 };
  all.forEach(s => { if (s.status in counts) counts[s.status]++; });
  document.getElementById("summary").textContent = t("summary", counts);
  document.getElementById("clock").textContent =
    new Date(now).toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" });

  const pageList = pages();
  page = Math.min(page, Math.max(0, pageList.length - 1));
  renderPager(pageList);

  renderAddButton();
  renderPicker();
  if (all.length === 0) {
    const manual = latest.settings.session_mode === "manual" && (latest.sessions || []).length > 0;
    grid.className = "grid";
    grid.innerHTML = `<div class="empty">${mascotSVG(0, "idle")}<span>${esc(t(manual ? "emptyManual" : "empty"))}</span></div>`;
    return;
  }
  // Cards fill the page in group order: 1 = full screen, 2 = halves, 3 or more
  // in two rows, split so project groups stay whole (e.g. 4 = 2+2, or 3+1 for
  // a group of three).
  const sessions = pageList[page];
  const n = sessions.length;
  const rows = n <= 2 ? 1 : 2;
  const top = rows === 1 ? n : splitRows(sessions);
  const colors = groupColors(all);
  grid.className = `grid rows-${rows} ${n === 1 ? "size-l" : n === 2 ? "size-m" : ""}`;
  // Split each row into runs of cards from the same project; a run of two or
  // more becomes one shared box spanning the columns of its cards.
  const runs = [];
  sessions.forEach((s, i) => {
    const row = i < top ? 0 : 1;
    const span = 60 / (row === 0 ? top : n - top);
    const last = runs[runs.length - 1];
    if (last && last.row === row && last.project === s.project) {
      last.cards.push(s);
      last.span += span;
    } else {
      runs.push({ row, project: s.project, cards: [s], span });
    }
  });
  grid.innerHTML = runs.map(r => {
    const color = colors[r.project];
    return r.cards.length > 1
      ? `<div class="group${color ? " tinted" : ""}" style="grid-column: span ${r.span}${color ? `; --group: ${color}` : ""}">${r.cards.map(s => cardHTML(s, now)).join("")}</div>`
      : cardHTML(r.cards[0], now, r.span, color);
  }).join("");
  stageRuns = runs.map(r => ({ key: `${r.row}/${r.project}`, sessions: r.cards }));
  measureStage();
  tickStage();
}

// nameHTML is the card heading: the project, then after a slash the session's title.
function nameHTML(s) {
  return `<p class="name" title="${esc(`${s.project} / ${s.title || t("newSession")}`)}"><span class="proj">${esc(s.project)}</span><span class="sep">/</span><span class="sess">${esc(s.title || t("newSession"))}</span></p>`;
}

// cardHTML draws one agent; span and color are set for a card that stands on
// its own in the grid (color when it's part of a group cut across rows). Its
// mascot lives on the stage; the card only keeps its place (home-spot).
function cardHTML(s, now, span, color) {
  const style = [span && `grid-column: span ${span}`, color && `--group: ${color}`].filter(Boolean).join("; ");
  return `<div class="card ${s.status}${color ? " tinted" : ""}"${style ? ` style="${style}"` : ""} title="${esc(s.host_id ? t("openInClaude") : s.cwd)}" draggable="true" data-id="${esc(s.id)}" data-slot="${s.slot}"${s.host_id ? " data-open" : ""}>
      <div class="head"><svg class="mascot home-spot" width="62" height="48" viewBox="0 0 78 60" aria-hidden="true"></svg><span class="head-right"><span class="badge">${esc(t(`status.${s.status}`))}</span><button class="remove" data-remove="${esc(s.id)}" aria-label="${esc(t("removeAgent"))}" title="${esc(t("removeAgent"))}">×</button></span></div>
      ${nameHTML(s)}
      <p class="line agent" title="${esc(s.client && t(`client.${s.client}`) !== `client.${s.client}` ? t("runsIn", { client: t(`client.${s.client}`) }) : "")}">${esc(agentLine(s))}</p>
      <p class="line action">${esc(actionText(s.action))}</p>
      ${stepText(s) ? `<p class="line">${esc(stepText(s))}</p>` : ""}
      <div class="foot">
        ${progress(s, now) !== null ? `<div class="bar"><div class="fill" style="width:${progress(s, now).toFixed(1)}%"></div></div>` : ""}
        <span class="line">${esc(metaText(s, now))}</span>
      </div>
    </div>`;
}

// The stage: a layer over the cards where the mascots live. Each one stands
// at its card's home spot, or walks to the group's campfire and back, as its
// life between jobs (life.js) goes. Mascots and fires are kept from one
// update to the next, so they move and animate smoothly.
const stage = document.getElementById("stage");
const life = {}; // session id -> { phase, at, walkMs }, see life.js
let stageRuns = []; // the groups on the page: [{ key, sessions }]
let homes = {}; // session id -> { x, y, w, h } of its card's home spot, in screen px

// measureStage reads where every card's mascot belongs, after the cards are drawn.
function measureStage() {
  const box = document.getElementById("native").getBoundingClientRect();
  const scale = box.width / 800;
  const at = r => ({ x: (r.left - box.left) / scale, y: (r.top - box.top) / scale, w: r.width / scale, h: r.height / scale });
  homes = {};
  grid.querySelectorAll(".card").forEach(card => {
    homes[card.dataset.id] = at(card.querySelector(".home-spot").getBoundingClientRect());
  });
}

// campSpots places the group's fire halfway between the first and the last
// mascot by it, so they meet in the middle, and the mascots on either side of
// it, half of them on each side. Returns { fire: { x, y, h }, spots: id -> { x, y }, sides: id -> "l" | "r" }.
function campSpots(campers) {
  const first = homes[campers[0].id], h = first.h, w = first.w;
  const bodyX = w * 30 / 78; // the body's middle on the mascot's canvas
  const fireX = (first.x + homes[campers[campers.length - 1].id].x) / 2 + bodyX;
  const fireW = h * 44 / 60;
  const left = Math.ceil(campers.length / 2);
  const spots = {}, sides = {};
  campers.forEach((s, i) => {
    const out = i < left ? left - 1 - i : i - left; // how many sit between it and the fire
    const body = i < left ? fireX - fireW / 2 - w * .42 - out * w * .75 : fireX + fireW / 2 + w * .4 + out * w * .75;
    spots[s.id] = { x: body - bodyX, y: first.y };
    sides[s.id] = i < left ? "l" : "r";
  });
  return { fire: { x: fireX - fireW / 2, y: first.y, h }, spots, sides };
}

// actorLook says how to draw a mascot in its phase: [status for mascotSVG,
// change, key]; the mascot is redrawn only when the key changes.
function actorLook(s, e, now) {
  const ago = now - e.at;
  switch (e.phase) {
    case "look": return ["looking", null, `look${e.at}`];
    case "wave": return ["waving", null, `wave${e.at}`];
    case "rouse": return ["walking", { kind: "wake", ago }, `rouse${e.at}`];
    case "out": case "back": return ["walking", null, "walk"];
    case "doze": case "settle": return ["done", { kind: "sleep", ago }, `doze${e.at}`];
    case "sleep": case "camp": return ["done", null, "sleep"];
  }
  // A change (waking up, a sulk) plays while it lasts, then the usual animation.
  const c = changed[s.id], playing = c && now - c.at < changeMs(c.kind);
  return [s.status, playing && { ...c, ago: now - c.at }, `${s.status}${playing ? c.at : ""}`];
}

const AWAY = ["out", "settle", "camp"]; // phases spent at the fire, or on the way there

function tickStage() {
  if (dragId) return;
  const now = Date.now();
  stepLife(life, stageRuns, now);
  const seen = new Set(), fires = new Set();
  for (const run of stageRuns) {
    const campers = run.sessions.filter(s => homes[s.id] && CAMPING.includes(life[s.id].phase));
    const camp = campers.length ? campSpots(campers) : null;
    for (const s of run.sessions) {
      const home = homes[s.id];
      if (!home) continue;
      const e = life[s.id];
      seen.add(s.id);
      let el = stage.querySelector(`.actor[data-id="${CSS.escape(s.id)}"]`);
      const fresh = !el;
      if (fresh) {
        el = document.createElement("div");
        el.className = "actor";
        el.dataset.id = s.id;
        stage.appendChild(el);
      }
      // Draw it anew only when how it looks changes.
      const [status, change, key] = actorLook(s, e, now);
      if (el.dataset.key !== key) {
        el.dataset.key = key;
        el.className = `actor ${status}`;
        el.innerHTML = mascotSVG(s.mascot, status, change);
      }
      const svg = el.firstElementChild;
      svg.style.width = `${home.w}px`; svg.style.height = `${home.h}px`;
      // Where it stands, and how it gets there: walks at walking pace, a
      // small shuffle (making room by the fire) eases, anything else (a new
      // page or layout) jumps.
      const to = AWAY.includes(e.phase) && camp ? camp.spots[s.id] : home;
      const from = { x: Number(el.dataset.x), y: Number(el.dataset.y) };
      const walking = e.phase === "out" || e.phase === "back";
      if (fresh || from.x !== to.x || from.y !== to.y) {
        const dist = fresh ? 0 : Math.hypot(to.x - from.x, to.y - from.y);
        const ms = walking ? dist / WALK_SPEED : dist < 60 ? 400 : 0;
        if (walking && e.walkMs === undefined) e.walkMs = ms;
        el.style.transition = ms ? `transform ${ms}ms ${walking ? "linear" : "ease"}` : "none";
        el.style.transform = `translate(${to.x}px, ${to.y}px)`;
        el.dataset.x = to.x; el.dataset.y = to.y;
      } else if (walking && e.walkMs === undefined) {
        e.walkMs = 0; // already there
      }
      // A card whose mascot is away hides its badge and moves × to the outer corner.
      const card = grid.querySelector(`.card[data-id="${CSS.escape(s.id)}"]`);
      const away = AWAY.includes(e.phase) && camp ? camp.sides[s.id] : null;
      card.classList.toggle("camp", !!away);
      card.classList.toggle("camp-l", away === "l");
      card.classList.toggle("camp-r", away === "r");
    }
    // The fire lights once someone sits by it and goes out when the last one leaves.
    if (camp) {
      fires.add(run.key);
      let fire = stage.querySelector(`.fire[data-run="${CSS.escape(run.key)}"]`);
      if (!fire) {
        fire = document.createElement("div");
        fire.className = "fire";
        fire.dataset.run = run.key;
        fire.innerHTML = campfireSVG();
        stage.prepend(fire);
      }
      clearTimeout(fire.out);
      delete fire.out;
      const svg = fire.firstElementChild;
      svg.style.height = `${camp.fire.h}px`; svg.style.width = `${camp.fire.h * 44 / 60}px`;
      fire.style.transform = `translate(${camp.fire.x}px, ${camp.fire.y}px)`;
      fire.classList.toggle("lit", campers.some(s => ["settle", "camp"].includes(life[s.id].phase)));
    }
  }
  stage.querySelectorAll(".actor").forEach(el => { if (!seen.has(el.dataset.id)) el.remove(); });
  stage.querySelectorAll(".fire").forEach(el => {
    if (fires.has(el.dataset.run) || el.out) return;
    el.classList.remove("lit");
    el.out = setTimeout(() => el.remove(), 1500);
  });
}
setInterval(tickStage, 100);

function renderPager(pageList) {
  const pager = document.getElementById("pager");
  pager.hidden = pageList.length <= 1;
  document.getElementById("prev").disabled = page === 0;
  document.getElementById("next").disabled = page >= pageList.length - 1;
  document.getElementById("dots").innerHTML = pageList.map((p, i) => {
    const alert = p.some(s => s.status === "waiting");
    return `<span class="dot${i === page ? " current" : ""}${alert ? " alert" : ""}"></span>`;
  }).join("");
}

function goToPage(p) {
  const count = pages().length;
  page = Math.max(0, Math.min(p, count - 1));
  render();
}

// When an agent starts waiting for the user on another page, show that page.
function jumpToNewWait() {
  if (!latest.settings.jump_to_waiting) return;
  const pageList = pages();
  for (let p = 0; p < pageList.length; p++) {
    if (pageList[p].some(s => s.status === "waiting" && lastStatus[s.id] !== "waiting")) {
      page = p;
      return;
    }
  }
}

// noteChanges remembers agents that just woke up (from done or idle to
// working or waiting) or fell asleep (the other way), so their mascot plays
// that change before its usual animation.
function noteChanges() {
  const asleep = st => st === "done" || st === "idle";
  for (const s of latest.sessions) {
    const before = lastStatus[s.id];
    if (before === undefined || before === s.status) continue;
    // An interrupted agent goes into a sulk, and comes out of it when it gets
    // back to work. Falling asleep is up to its life between jobs (life.js);
    // waking up plays here when it was asleep in its card (by the fire it
    // gets up and walks back instead).
    let kind = null;
    if (s.status === "interrupted" && !asleep(before)) kind = "sulk";
    else if (before === "interrupted" && !asleep(s.status)) kind = "unsulk";
    else if (asleep(before) && !asleep(s.status) && ["sleep", "doze"].includes(life[s.id]?.phase)) kind = "wake";
    if (!kind) continue;
    const svg = document.querySelector(`.actor[data-id="${CSS.escape(s.id)}"] svg.mascot`);
    changed[s.id] = { kind, at: Date.now(), ...poseOf(svg) };
    setTimeout(render, changeMs(kind) + 50); // switch to the usual animation once it's over
  }
}

function onState(data) {
  latest = data;
  offset = new Date(latest.now).getTime() - Date.now();
  if (latest.settings.language !== lang && STRINGS[latest.settings.language]) {
    lang = latest.settings.language;
    translateStatic();
  }
  jumpToNewWait();
  noteChanges();
  lastStatus = Object.fromEntries(latest.sessions.map(s => [s.id, s.status]));
  render();
  renderSettings();
}

// --- settings panel ---

function saveSettings(change) {
  latest.settings = { ...latest.settings, ...change };
  renderSettings();
  render();
  fetch("/api/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(change) });
}

function segment(id, options, current, onPick) {
  const el = document.getElementById(id);
  el.innerHTML = options.map(o => `<button data-v="${o.value}" class="${o.value === current ? "on" : ""}">${esc(o.label)}</button>`).join("");
  el.onclick = e => {
    const b = e.target.closest("button");
    if (b) onPick(b.dataset.v);
  };
}

// --- manual mode: adding and removing agents ---

function pin(id, pinned) {
  const s = (latest.sessions || []).find(x => x.id === id);
  if (s) s.pinned = pinned; // show it right away; the daemon confirms with the next update
  render();
  fetch("/api/pin", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, pinned }) });
}

// removeCard takes a card off the screen: in manual mode it's unpinned (and
// stays in the "+" list), in auto mode the daemon forgets it until the
// session sends something again.
function removeCard(id) {
  if (latest.settings.session_mode === "manual") { pin(id, false); return; }
  latest.sessions = (latest.sessions || []).filter(x => x.id !== id);
  render();
  fetch("/api/remove", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) });
}

// renderAddButton shows "+" in manual mode, with an orange dot when an agent
// that isn't on screen is waiting for the user.
function renderAddButton() {
  const manual = latest.settings.session_mode === "manual";
  document.getElementById("open-picker").hidden = !manual;
  const off = (latest.sessions || []).filter(s => !s.pinned);
  document.getElementById("hidden-alert").hidden = !(manual && off.some(s => s.status === "waiting"));
}

function renderPicker() {
  const off = (latest.sessions || []).filter(s => !s.pinned);
  document.getElementById("pick-list").innerHTML = off.length === 0
    ? `<div class="pick-empty">${esc(t("allOnScreen"))}</div>`
    : off.map(s => `<button class="pick ${s.status}" data-pick="${esc(s.id)}">
        ${mascotSVG(s.mascot, s.status)}
        <span class="pick-text">${nameHTML(s)}</span>
        <span class="badge">${esc(t(`status.${s.status}`))}</span>
      </button>`).join("");
}

document.getElementById("open-picker").onclick = () => { document.getElementById("picker").hidden = false; };
document.getElementById("close-picker").onclick = () => { document.getElementById("picker").hidden = true; };
document.getElementById("pick-list").addEventListener("click", e => {
  const b = e.target.closest("[data-pick]");
  if (b) pin(b.dataset.pick, true);
});

function renderSettings() {
  const s = latest.settings;
  segment("set-cards", [1, 2, 3, 4, 5, 6].map(n => ({ value: String(n), label: String(n) })), String(s.cards_per_page),
    v => saveSettings({ cards_per_page: Number(v) }));
  segment("set-hide", [0, 5, 15, 60].map(m => ({ value: String(m), label: m ? t("afterMinutes", { m }) : t("never") })),
    String(s.hide_done_after_min), v => saveSettings({ hide_done_after_min: Number(v) }));
  segment("set-mode", ["auto", "manual"].map(m => ({ value: m, label: t(`modes.${m}`) })), s.session_mode, v => {
    // The daemon keeps what's on screen when switching to manual; mirror it so the screen doesn't flash empty.
    if (v === "manual" && s.session_mode !== "manual") (latest.sessions || []).forEach(x => { x.pinned = true; });
    saveSettings({ session_mode: v });
  });
  segment("set-lang", (latest.languages || ["en"]).filter(l => STRINGS[l]).map(l => ({ value: l, label: STRINGS[l].languageName })),
    s.language, v => saveSettings({ language: v }));
  const jump = document.getElementById("set-jump");
  jump.classList.toggle("on", !!s.jump_to_waiting);
  jump.setAttribute("aria-checked", String(!!s.jump_to_waiting));
}

document.getElementById("set-jump").onclick = () => saveSettings({ jump_to_waiting: !latest.settings.jump_to_waiting });
document.getElementById("open-settings").onclick = () => { document.getElementById("panel").hidden = false; };
document.getElementById("close-settings").onclick = () => { document.getElementById("panel").hidden = true; };
document.getElementById("prev").onclick = () => goToPage(page - 1);
document.getElementById("next").onclick = () => goToPage(page + 1);

// --- rearranging and swiping ---

// Drag a card onto another to swap them; the daemon remembers it per project.
// Re-rendering is paused while dragging so live updates don't cancel the drag.
const grid = document.getElementById("grid");
grid.addEventListener("click", e => {
  const b = e.target.closest("[data-remove]");
  if (b) { removeCard(b.dataset.remove); return; }
  // Clicking a card of a session in the Claude app opens that session there.
  const card = e.target.closest(".card[data-open]");
  if (!card) return;
  card.classList.add("opening");
  setTimeout(() => card.classList.remove("opening"), 600);
  fetch("/api/open", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: card.dataset.id }) });
});
grid.addEventListener("dragstart", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  dragId = card.dataset.id;
  card.classList.add("dragging");
  stage.hidden = true; // the mascots wait off stage while a card is dragged
  e.dataTransfer.effectAllowed = "move";
});
grid.addEventListener("dragover", e => {
  const target = e.target.closest("[data-slot]");
  if (!dragId || !target) return;
  e.preventDefault();
  grid.querySelectorAll(".drop").forEach(el => el.classList.remove("drop"));
  target.classList.add("drop");
});
grid.addEventListener("drop", e => {
  const target = e.target.closest("[data-slot]");
  if (!dragId || !target) return;
  e.preventDefault();
  fetch("/api/move", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: dragId, slot: Number(target.dataset.slot) }) });
});
grid.addEventListener("dragend", () => { dragId = null; stage.hidden = false; render(); });

// Swipe left/right with a finger to change pages, like on the device.
let swipeX = null;
grid.addEventListener("pointerdown", e => { if (e.pointerType === "touch") swipeX = e.clientX; });
grid.addEventListener("pointerup", e => {
  if (swipeX === null) return;
  const dx = e.clientX - swipeX;
  swipeX = null;
  if (Math.abs(dx) > 50) goToPage(page + (dx < 0 ? 1 : -1));
});

function fit() {
  const screen = document.querySelector(".screen");
  document.getElementById("native").style.transform = `scale(${screen.clientWidth / 800})`;
}

function connect() {
  const es = new EventSource("/api/stream");
  const conn = document.getElementById("conn");
  es.onopen = () => conn.classList.add("on");
  es.onmessage = e => onState(JSON.parse(e.data));
  es.onerror = () => conn.classList.remove("on"); // EventSource reconnects on its own
}

window.addEventListener("resize", fit);
fit();
translateStatic();
render();
renderSettings();
connect();
setInterval(render, 3000); // keeps clocks and progress bars moving between updates
</script>
</body>
</html>
