<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-desk simulator</title>
<style>
  :root {
    --page: #e8e6df; --bezel: #1c1c1b; --screen: #121211; --card: #1f1f1d; --card-border: #2e2e2b;
    --text: #f1efe8; --muted: #a3a199;
    --working-bg: #0c447c; --working-fg: #b5d4f4;
    --waiting-bg: #633806; --waiting-fg: #fac775; --waiting-border: #ef9f27;
    --done-bg: #27500a; --done-fg: #c0dd97;
    --error-bg: #791f1f; --error-fg: #f7c1c1;
    --idle-bg: #2c2c2a; --idle-fg: #b4b2a9;
  }
  @media (prefers-color-scheme: dark) { :root { --page: #0b0b0b; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--page); display: flex; align-items: center; justify-content: center;
         font-family: system-ui, "Segoe UI", sans-serif; padding: 16px; }
  .device { background: var(--bezel); border-radius: 22px; padding: 18px; width: min(100%, 836px); }
  .screen { position: relative; width: 100%; aspect-ratio: 800 / 480; background: var(--screen); border-radius: 6px; overflow: hidden; }
  /* Everything inside is laid out at the device's native 800x480 and scaled to fit. */
  .native { position: absolute; top: 0; left: 0; width: 800px; height: 480px; transform-origin: 0 0;
            padding: 12px; display: flex; flex-direction: column; gap: 10px; color: var(--text); }
  .top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 0 4px; }
  .conn { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e24b4a; margin-right: 6px; }
  .conn.on { background: #639922; }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px;
          display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .card.waiting { border: 2px solid var(--waiting-border); }
  .head { display: flex; justify-content: space-between; align-items: flex-start; height: 48px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 6px; white-space: nowrap; }
  .working .badge { background: var(--working-bg); color: var(--working-fg); }
  .waiting .badge { background: var(--waiting-bg); color: var(--waiting-fg); }
  .done .badge { background: var(--done-bg); color: var(--done-fg); }
  .error .badge { background: var(--error-bg); color: var(--error-fg); }
  .idle .badge { background: var(--idle-bg); color: var(--idle-fg); }
  .name { font-size: 17px; font-weight: 600; margin: 4px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line { font-size: 13px; color: var(--muted); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .action { color: var(--text); }
  .title { font-style: italic; margin-top: -4px; }
  .empty { grid-column: 1 / -1; grid-row: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 12px; color: var(--muted); font-size: 15px; }
  .slot { border: 1px dashed var(--card-border); border-radius: 12px; }
  .card[draggable] { cursor: grab; }
  .card.dragging { opacity: .4; }
  .drop { outline: 2px dashed var(--muted); outline-offset: -2px; }
  svg.mascot { image-rendering: pixelated; }
  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .4 } }
  .working svg.mascot { animation: bob .8s ease-in-out infinite; }
  .waiting svg.mascot { animation: pulse 1.1s ease-in-out infinite; }
</style>
</head>
<body>
<div class="device"><div class="screen"><div class="native" id="native">
  <div class="top"><span id="summary">…</span><span><span class="conn" id="conn"></span><span id="clock"></span></span></div>
  <div class="grid" id="grid"></div>
</div></div></div>

<script>
const COLORS = ["#D85A30", "#1D9E75", "#7F77DD", "#EF9F27", "#378ADD", "#D4537E", "#97C459", "#5DCAA5"];
const EYE = "#121211";
// X body, O eye, - closed eye, A antenna. Two body shapes, alternating by mascot index.
const SHAPES = [
  { awake: ["..XXXXXX..", ".XXXXXXXX.", "XXOXXXXOXX", "XXXXXXXXXX", ".XXXXXXXX.", ".X.X..X.X."],
    sleep: ["..XXXXXX..", ".XXXXXXXX.", "XX--XX--XX", "XXXXXXXXXX", ".XXXXXXXX.", ".XXXXXXXX."] },
  { awake: ["A........A", ".XXXXXXXX.", "XXOOXXOOXX", "XXXXXXXXXX", "XXXXXXXXXX", "X.X....X.X"],
    sleep: ["A........A", ".XXXXXXXX.", "XX--XX--XX", "XXXXXXXXXX", "XXXXXXXXXX", "XXXXXXXXXX"] },
];
const LABELS = { working: "Pracuje", waiting: "Czeka na Ciebie", done: "Gotowe", error: "Błąd", idle: "Bezczynny" };

function mascotSVG(index, status) {
  const color = COLORS[index % COLORS.length];
  const shape = SHAPES[index % SHAPES.length];
  const rows = status === "done" || status === "idle" ? shape.sleep : shape.awake;
  const u = 6;
  let rects = "";
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === "X" || ch === "A") rects += `<rect x="${x*u}" y="${y*u}" width="${u}" height="${u}" fill="${color}"/>`;
    else if (ch === "O") rects += `<rect x="${x*u}" y="${y*u}" width="${u}" height="${u}" fill="${EYE}"/>`;
    else if (ch === "-") rects += `<rect x="${x*u}" y="${y*u+u/2}" width="${u}" height="${u/2}" fill="${EYE}"/>`;
  }));
  if (status === "done") rects += `<text x="62" y="10" font-size="11" fill="#a3a199" font-family="monospace">z</text>`;
  return `<svg class="mascot" width="72" height="40" viewBox="0 0 72 40" aria-hidden="true">${rects}</svg>`;
}

function ago(from, now) {
  const m = Math.max(0, Math.floor((now - from) / 60000));
  if (m < 1) return "przed chwilą";
  if (m < 60) return `${m} min`;
  return `${Math.floor(m / 60)} h ${m % 60} min`;
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

let latest = { sessions: [], now: new Date().toISOString() };
let offset = 0; // server clock minus local clock

function render() {
  if (dragId) return;
  const now = Date.now() + offset;
  const grid = document.getElementById("grid");
  const sessions = latest.sessions || [];
  const counts = { working: 0, waiting: 0, done: 0 };
  sessions.forEach(s => { if (s.status in counts) counts[s.status]++; });
  document.getElementById("summary").textContent =
    `${counts.working} pracuje · ${counts.waiting} czeka · ${counts.done} gotowe` +
    (latest.hidden ? ` · +${latest.hidden} poza ekranem` : "");
  document.getElementById("clock").textContent =
    new Date(now).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" });

  if (sessions.length === 0) {
    grid.innerHTML = `<div class="empty">${mascotSVG(0, "idle")}<span>Brak aktywnych agentów. Uruchom sesję Claude Code.</span></div>`;
    return;
  }
  const bySlot = {};
  sessions.forEach(s => { bySlot[s.slot] = s; });
  let html = "";
  for (let slot = 0; slot < 6; slot++) {
    const s = bySlot[slot];
    if (!s) { html += `<div class="slot" data-slot="${slot}"></div>`; continue; }
    let meta = "";
    if (s.status === "done") meta = `Skończył ${ago(new Date(s.finished_at), now)} temu`.replace("przed chwilą temu", "przed chwilą");
    else if (s.status !== "idle") meta = ago(new Date(s.turn_start), now);
    if (s.steps && s.status !== "done") meta += ` · krok ${Math.min(s.steps.done + 1, s.steps.total)}/${s.steps.total}`;
    html += `<div class="card ${s.status}" title="${esc(s.cwd)}" draggable="true" data-id="${esc(s.id)}" data-slot="${slot}">
      <div class="head">${mascotSVG(s.mascot, s.status)}<span class="badge">${LABELS[s.status] || s.status}</span></div>
      <p class="name">${esc(s.project)}</p>
      <p class="line title">${esc(s.title || "Nowa sesja")}</p>
      <p class="line action">${esc(s.action)}</p>
      <p class="line">${esc(meta)}</p>
    </div>`;
  }
  grid.innerHTML = html;
}

// Drag a card onto another slot to rearrange; the daemon remembers it per project.
// Re-rendering is paused while dragging so live updates don't cancel the drag.
let dragId = null;
const grid = document.getElementById("grid");
grid.addEventListener("dragstart", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  dragId = card.dataset.id;
  card.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
});
grid.addEventListener("dragover", e => {
  const target = e.target.closest("[data-slot]");
  if (!dragId || !target) return;
  e.preventDefault();
  grid.querySelectorAll(".drop").forEach(el => el.classList.remove("drop"));
  target.classList.add("drop");
});
grid.addEventListener("drop", e => {
  const target = e.target.closest("[data-slot]");
  if (!dragId || !target) return;
  e.preventDefault();
  fetch("/api/move", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: dragId, slot: Number(target.dataset.slot) }) });
});
grid.addEventListener("dragend", () => { dragId = null; render(); });

function fit() {
  const screen = document.querySelector(".screen");
  document.getElementById("native").style.transform = `scale(${screen.clientWidth / 800})`;
}

function connect() {
  const es = new EventSource("/api/stream");
  const conn = document.getElementById("conn");
  es.onopen = () => conn.classList.add("on");
  es.onmessage = e => {
    latest = JSON.parse(e.data);
    offset = new Date(latest.now).getTime() - Date.now();
    render();
  };
  es.onerror = () => conn.classList.remove("on"); // EventSource reconnects on its own
}

window.addEventListener("resize", fit);
fit();
render();
connect();
setInterval(render, 15000);
</script>
</body>
</html>
